name: Build Happ remote lists

on:
  push:
    branches: [main]
    paths:
      - vpn_rules.conf
      - happ/remote.py
      - happ/build_profile.py
      - happ/test_remote.py
      - happ/xray-check.json
      - happ/asn-prefixes.json
      - .github/workflows/happ-lists.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: happ-remote-lists
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify converter and remote format
        run: |
          python3 happ/test_profile.py
          python3 happ/test_remote.py
      - name: Build current source and refresh ASN prefixes
        run: python3 happ/remote.py --refresh-asn --output happ/dist
      - name: Verify generated protobuf and policy
        run: python3 happ/test_remote.py --artifacts happ/dist
      - name: Validate with pinned Xray core (no listeners or VPN connections)
        env:
          XRAY_CHECK_DIR: ${{ runner.temp }}/xray-happ-check
          XRAY_LOCATION_ASSET: ${{ github.workspace }}/happ/dist
        run: |
          set -euo pipefail
          mkdir -p "$XRAY_CHECK_DIR"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip \
            -o "$XRAY_CHECK_DIR/xray.zip"
          echo "8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  $XRAY_CHECK_DIR/xray.zip" | sha256sum --check -
          unzip -q "$XRAY_CHECK_DIR/xray.zip" xray -d "$XRAY_CHECK_DIR"
          "$XRAY_CHECK_DIR/xray" run -test -config happ/xray-check.json
      - name: Publish complete bundle in one commit
        env:
          PUBLISH_PATH: ${{ runner.temp }}/happ-data-publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin happ-data; then
            git fetch origin happ-data
            git worktree add --detach "$PUBLISH_PATH" FETCH_HEAD
          else
            git worktree add --detach "$PUBLISH_PATH" HEAD
            git -C "$PUBLISH_PATH" switch --orphan happ-data
          fi
          for file in geosite.dat geoip.dat profile.json IMPORT-HAPP.txt rules.json asn-prefixes.json manifest.json README.md; do
            cp "happ/dist/$file" "$PUBLISH_PATH/$file"
            git -C "$PUBLISH_PATH" add -- "$file"
          done
          if git -C "$PUBLISH_PATH" diff --cached --quiet; then
            echo 'No artifact changes'
            exit 0
          fi
          git -C "$PUBLISH_PATH" commit -m "Build Happ lists from $(git rev-parse --short HEAD)"
          git -C "$PUBLISH_PATH" push origin HEAD:refs/heads/happ-data
