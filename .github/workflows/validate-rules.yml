name: Validate VPN rule automation

on:
  pull_request:
    paths:
      - vpn_rules.base.conf
      - vpn_rules.conf
      - scripts/**
      - happ/**
      - .github/workflows/auto-rules.yml
      - .github/workflows/validate-rules.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile candidate config (no writes to GitHub)
        run: python3 scripts/update_rules.py
      - name: Test policy and Happ round-trip
        run: |
          python3 scripts/test_update_rules.py
          python3 happ/test_profile.py
          python3 happ/test_remote.py
          python3 happ/remote.py --preview-uncommitted --output "$RUNNER_TEMP/happ-preview"
          python3 happ/test_remote.py --artifacts "$RUNNER_TEMP/happ-preview"
